{{- if and .Values.publisher.create .Values.publisher.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "chartmuseum.fullname" . }}-publisher
  labels:
    {{- include "chartmuseum.labels" . | nindent 4 }}
rules:
  # Allow publishers to create Jobs/Pods that push charts into ChartMuseum
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/portforward", "services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "chartmuseum.fullname" . }}-publisher
  labels:
    {{- include "chartmuseum.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "chartmuseum.fullname" . }}-publisher
subjects:
  - kind: ServiceAccount
    name: {{ .Values.publisher.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
