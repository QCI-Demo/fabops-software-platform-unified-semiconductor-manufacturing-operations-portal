{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "chartmuseum.serviceAccountName" . }}
  labels:
    {{- include "chartmuseum.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
{{- if and .Values.publisher.create .Values.publisher.serviceAccount.name }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.publisher.serviceAccount.name }}
  labels:
    {{- include "chartmuseum.labels" . | nindent 4 }}
    fabops.io/role: chart-publisher
  {{- with .Values.publisher.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
