# Default values for kafka-connect with JMX Exporter
replicaCount: 3

image:
  repository: fabops/kafka-connect
  tag: "7.5.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9404"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8083
  annotations: {}

# JMX Exporter / Prometheus metrics configuration
metrics:
  enabled: true
  service:
    type: ClusterIP
    port: 9404
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9404"
  serviceMonitor:
    enabled: true
    namespace: ""
    interval: 30s
    scrapeTimeout: 10s
    labels:
      release: prometheus
    additionalLabels: {}

resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 2Gi

# Kafka configuration
kafka:
  bootstrapServers: "kafka.fabops.svc.cluster.local:9092"
  groupId: "fabops-connect-cluster"

# Schema Registry configuration
schemaRegistry:
  url: "http://schema-registry.fabops.svc.cluster.local:8081"

# Connect worker configuration
connect:
  configStorageTopic: "fabops-connect-configs"
  offsetStorageTopic: "fabops-connect-offsets"
  statusStorageTopic: "fabops-connect-status"
  replicationFactor: 3
  offsetFlushInterval: 10000
  offsetFlushTimeout: 5000

# Error handling configuration
errorHandling:
  tolerance: "all"
  dlqTopic: "fabops-connect-dlq"
  dlqReplicationFactor: 3
  logEnabled: true
  logIncludeMessages: true
  retryDelayMaxMs: 60000
  retryTimeoutMs: 300000

# Connector plugins to install
plugins:
  - name: snowflake-kafka-connector
    version: "2.1.0"

# JMX Exporter configuration
jmxExporter:
  enabled: true
  port: 9404
  configPath: "/opt/jmx-exporter/config.yaml"

livenessProbe:
  httpGet:
    path: /connectors
    port: http
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /connectors
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 3

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - kafka-connect
          topologyKey: kubernetes.io/hostname

# Extra environment variables
extraEnv:
  - name: CONNECT_LOG4J_ROOT_LOGLEVEL
    value: "INFO"
  - name: CONNECT_LOG4J_LOGGERS
    value: "org.apache.kafka.connect.runtime.rest=WARN,org.reflections=ERROR"
