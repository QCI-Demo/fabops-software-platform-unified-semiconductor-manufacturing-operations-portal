# Kafka Connect Distributed Worker Configuration
# With JMX Exporter enabled for Prometheus metrics

# Cluster configuration
bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
group.id=fabops-connect-cluster

# Connector configuration storage topics
config.storage.topic=fabops-connect-configs
config.storage.replication.factor=3

offset.storage.topic=fabops-connect-offsets
offset.storage.replication.factor=3
offset.storage.partitions=25

status.storage.topic=fabops-connect-status
status.storage.replication.factor=3
status.storage.partitions=5

# Converter configuration
key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=${SCHEMA_REGISTRY_URL:-http://schema-registry:8081}

# Internal converter for Connect internal topics
internal.key.converter=org.apache.kafka.connect.json.JsonConverter
internal.value.converter=org.apache.kafka.connect.json.JsonConverter
internal.key.converter.schemas.enable=false
internal.value.converter.schemas.enable=false

# REST API configuration
rest.port=8083
rest.advertised.host.name=${CONNECT_REST_ADVERTISED_HOST_NAME:-localhost}

# Plugin path
plugin.path=/usr/share/java,/usr/share/confluent-hub-components

# Producer configuration for exactly-once semantics
producer.enable.idempotence=true
producer.acks=all
producer.retries=2147483647
producer.max.in.flight.requests.per.connection=5

# Consumer configuration
consumer.auto.offset.reset=earliest
consumer.enable.auto.commit=false

# Offset flush settings
offset.flush.interval.ms=10000
offset.flush.timeout.ms=5000

# Task error handling with dead-letter queue
errors.tolerance=all
errors.deadletterqueue.topic.name=fabops-connect-dlq
errors.deadletterqueue.topic.replication.factor=3
errors.deadletterqueue.context.headers.enable=true
errors.log.enable=true
errors.log.include.messages=true
errors.retry.delay.max.ms=60000
errors.retry.timeout=300000

# Monitoring - Metrics Reporter
metric.reporters=org.apache.kafka.common.metrics.JmxReporter

# Connect metrics
connect.metrics.sample.window.ms=30000
connect.metrics.num.samples=2
