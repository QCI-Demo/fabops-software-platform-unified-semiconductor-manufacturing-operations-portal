# Grafana Dashboard Provisioning Configuration
# Auto-discovers and loads dashboards from the dashboards directory

apiVersion: 1

providers:
  - name: 'FabOps Ingestion Dashboards'
    orgId: 1
    folder: 'FabOps Ingestion'
    folderUid: 'fabops-ingestion'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/fabops-ingestion
      foldersFromFilesStructure: false
