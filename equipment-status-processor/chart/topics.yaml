# Kafka Topic Configuration for Equipment Status Processor
# Reference in Helm chart via .Values.kafka.topics

topics:
  # Raw telemetry topic - source for stream processing
  # Retention: 7 days (604800000 ms)
  - name: fabops.telemetry.raw
    partitions: 6
    replicationFactor: 3
    config:
      retention.ms: "604800000"      # 7 days
      cleanup.policy: "delete"
      min.insync.replicas: "2"
      segment.ms: "86400000"         # 1 day segments

  # Equipment status topic - compacted for latest status per equipment
  # Cleanup: compact (keeps latest record per key)
  - name: fabops.equipment.status
    partitions: 6
    replicationFactor: 3
    config:
      cleanup.policy: "compact"
      min.cleanable.dirty.ratio: "0.5"
      delete.retention.ms: "86400000"  # 1 day tombstone retention
      min.insync.replicas: "2"
      segment.ms: "86400000"

  # Critical alert topic - retained for 30 days for audit trail
  # Retention: 30 days (2592000000 ms)
  - name: fabops.equipment.critical-alert
    partitions: 6
    replicationFactor: 3
    config:
      retention.ms: "2592000000"     # 30 days
      cleanup.policy: "delete"
      min.insync.replicas: "2"
      segment.ms: "86400000"
