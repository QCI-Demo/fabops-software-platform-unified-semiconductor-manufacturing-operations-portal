# Kafka Topic Configuration for Equipment Status Processor
# This file defines the topic configurations referenced by Helm chart
# via .Values.kafka.topics

topics:
  # Raw telemetry topic - source data from ingestion service
  # Retention: 7 days to allow replay and debugging
  rawTelemetry:
    name: fabops.telemetry.raw
    partitions: 12
    replicationFactor: 3
    config:
      retention.ms: "604800000"           # 7 days (7 * 24 * 60 * 60 * 1000)
      segment.bytes: "1073741824"         # 1GB segments
      cleanup.policy: "delete"
      min.insync.replicas: "2"
      compression.type: "lz4"

  # Equipment status topic - compacted for latest state per equipment
  # Compacted to maintain only the latest status per equipment ID
  equipmentStatus:
    name: fabops.equipment.status
    partitions: 12
    replicationFactor: 3
    config:
      cleanup.policy: "compact"
      min.cleanable.dirty.ratio: "0.5"
      segment.ms: "86400000"              # 1 day segments for compaction
      delete.retention.ms: "86400000"     # 1 day tombstone retention
      min.insync.replicas: "2"
      compression.type: "lz4"

  # Critical alert topic - retained for 30 days for audit
  # Extended retention for incident investigation and compliance
  criticalAlert:
    name: fabops.alerts.critical
    partitions: 6
    replicationFactor: 3
    config:
      retention.ms: "2592000000"          # 30 days (30 * 24 * 60 * 60 * 1000)
      segment.bytes: "536870912"          # 512MB segments
      cleanup.policy: "delete"
      min.insync.replicas: "2"
      compression.type: "lz4"
      # Longer retention for audit trail
      retention.bytes: "-1"               # No size-based retention
