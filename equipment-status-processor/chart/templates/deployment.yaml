apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "equipment-status-processor.fullname" . }}
  labels:
    {{- include "equipment-status-processor.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "equipment-status-processor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
      labels:
        {{- include "equipment-status-processor.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "equipment-status-processor.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            # Kafka Configuration
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.kafka.bootstrapServers | quote }}
            - name: SCHEMA_REGISTRY_URL
              value: {{ .Values.kafka.schemaRegistryUrl | quote }}
            - name: KAFKA_STREAMS_APPLICATION_ID
              value: {{ .Values.kafka.streams.applicationId | quote }}
            - name: KAFKA_REPLICATION_FACTOR
              value: {{ .Values.kafka.streams.replicationFactor | quote }}
            - name: KAFKA_COMMIT_INTERVAL_MS
              value: {{ .Values.kafka.streams.commitIntervalMs | quote }}
            - name: KAFKA_STATE_DIR
              value: {{ .Values.kafka.streams.stateDir | quote }}
            
            # Topic Names
            - name: KAFKA_TOPIC_TELEMETRY_RAW
              value: {{ .Values.kafka.topics.telemetryRaw | quote }}
            - name: KAFKA_TOPIC_EQUIPMENT_STATUS
              value: {{ .Values.kafka.topics.equipmentStatus | quote }}
            - name: KAFKA_TOPIC_CRITICAL_ALERT
              value: {{ .Values.kafka.topics.criticalAlert | quote }}
            
            # Health Rule Engine Configuration
            - name: HEALTH_TEMP_WARNING
              value: {{ .Values.health.rules.temperature.warningThreshold | quote }}
            - name: HEALTH_TEMP_CRITICAL
              value: {{ .Values.health.rules.temperature.criticalThreshold | quote }}
            - name: HEALTH_TEMP_MAX
              value: {{ .Values.health.rules.temperature.maxThreshold | quote }}
            - name: HEALTH_PRESSURE_MIN
              value: {{ .Values.health.rules.pressure.minThreshold | quote }}
            - name: HEALTH_PRESSURE_WARNING_LOW
              value: {{ .Values.health.rules.pressure.warningLowThreshold | quote }}
            - name: HEALTH_PRESSURE_WARNING_HIGH
              value: {{ .Values.health.rules.pressure.warningHighThreshold | quote }}
            - name: HEALTH_PRESSURE_CRITICAL
              value: {{ .Values.health.rules.pressure.criticalThreshold | quote }}
            - name: HEALTH_CRITICAL_ERROR_CODES
              value: {{ .Values.health.rules.errorCodes.criticalCodes | quote }}
            - name: HEALTH_WARNING_ERROR_CODES
              value: {{ .Values.health.rules.errorCodes.warningCodes | quote }}
            - name: HEALTH_WEIGHT_TEMP
              value: {{ .Values.health.rules.weights.temperature | quote }}
            - name: HEALTH_WEIGHT_PRESSURE
              value: {{ .Values.health.rules.weights.pressure | quote }}
            - name: HEALTH_WEIGHT_ERROR
              value: {{ .Values.health.rules.weights.errorCode | quote }}
            
            # Logging
            - name: LOG_LEVEL
              value: {{ .Values.logging.level | quote }}
            - name: KAFKA_LOG_LEVEL
              value: {{ .Values.logging.kafkaLogLevel | quote }}
            
            {{- with .Values.extraEnvVars }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: state-store
              mountPath: {{ .Values.kafka.streams.stateDir }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.persistence.enabled }}
        - name: state-store
          persistentVolumeClaim:
            claimName: {{ include "equipment-status-processor.fullname" . }}-state
        {{- else }}
        - name: state-store
          emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
