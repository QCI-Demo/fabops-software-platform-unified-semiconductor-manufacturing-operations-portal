{{- range .Values.kafka.topics }}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: {{ .name | replace "." "-" }}
  labels:
    {{- include "equipment-status-processor.labels" $ | nindent 4 }}
    strimzi.io/cluster: {{ $.Values.kafka.clusterName | default "kafka" }}
spec:
  topicName: {{ .name }}
  partitions: {{ .partitions | default 6 }}
  replicas: {{ .replicationFactor | default 3 }}
  config:
    {{- if .retention }}
    retention.ms: {{ .retention | quote }}
    {{- end }}
    {{- if .cleanup }}
    cleanup.policy: {{ .cleanup | quote }}
    {{- else }}
    cleanup.policy: "delete"
    {{- end }}
    min.insync.replicas: "2"
{{- end }}
