# Kafka Topic Creation Job using Strimzi or Confluent operator
# This template creates KafkaTopic custom resources for Strimzi Kafka Operator
{{- range $key, $topic := .Values.kafka.topics }}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: {{ $topic.name | replace "." "-" }}
  labels:
    strimzi.io/cluster: kafka
    {{- include "equipment-status-processor.labels" $ | nindent 4 }}
spec:
  topicName: {{ $topic.name }}
  partitions: {{ $topic.partitions }}
  replicas: {{ $topic.replicationFactor }}
  config:
    {{- range $configKey, $configValue := $topic.config }}
    {{ $configKey }}: {{ $configValue | quote }}
    {{- end }}
{{- end }}
