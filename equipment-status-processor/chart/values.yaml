# Default values for equipment-status-processor
replicaCount: 2

image:
  repository: fabops/equipment-status-processor
  pullPolicy: IfNotPresent
  tag: ""  # Defaults to appVersion

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

# Kafka configuration
kafka:
  bootstrapServers: "kafka:9092"
  replicationFactor: 3
  streams:
    applicationId: fabops-equipment-status-processor
    stateDir: /tmp/kafka-streams
  topics:
    rawTelemetry:
      name: fabops.telemetry.raw
      retention: 604800000  # 7 days in milliseconds
      partitions: 6
      replicationFactor: 3
    equipmentStatus:
      name: fabops.equipment.status
      cleanup: compact
      partitions: 6
      replicationFactor: 3
    criticalAlert:
      name: fabops.equipment.critical-alert
      retention: 2592000000  # 30 days in milliseconds
      partitions: 6
      replicationFactor: 3

# Health rule thresholds
health:
  thresholds:
    temperature:
      warning: 75.0
      critical: 90.0
    pressure:
      warningLow: 0.8
      warningHigh: 1.2
      criticalLow: 0.5
      criticalHigh: 1.5
    errorCodes:
      critical:
        - E001
        - E002
        - E003
        - E010
        - E020
      warning:
        - W001
        - W002
        - W003
  scoring:
    baseScore: 100
    temperatureWeight: 30
    pressureWeight: 30
    errorCodeWeight: 40

# Liveness and readiness probes
livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  initialDelaySeconds: 60
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - equipment-status-processor
          topologyKey: kubernetes.io/hostname

# Extra environment variables
extraEnv: []

# Volume mounts for state store
persistence:
  enabled: false
  size: 5Gi
  storageClass: ""
