# Default values for equipment-stream-processor
replicaCount: 2

image:
  repository: fabops/equipment-stream-processor
  pullPolicy: IfNotPresent
  tag: "1.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Kafka Configuration
kafka:
  bootstrapServers: "kafka-bootstrap.kafka.svc.cluster.local:9092"
  replicationFactor: 3
  streamThreads: 2
  
  # Topic Configuration with retention and compaction settings
  topics:
    telemetryRaw:
      name: "fabops.telemetry.raw"
      partitions: 12
      replicationFactor: 3
      config:
        # 7 days retention
        retention.ms: "604800000"
        cleanup.policy: "delete"
        
    equipmentStatus:
      name: "fabops.equipment.status"
      partitions: 12
      replicationFactor: 3
      config:
        # Compacted topic for latest status per equipment
        cleanup.policy: "compact"
        min.cleanable.dirty.ratio: "0.1"
        delete.retention.ms: "86400000"
        segment.ms: "3600000"
        
    criticalAlerts:
      name: "fabops.alerts.critical"
      partitions: 6
      replicationFactor: 3
      config:
        # 30 days retention
        retention.ms: "2592000000"
        cleanup.policy: "delete"

# Health Rule Engine Thresholds
health:
  thresholds:
    temperature:
      warning: 75.0
      critical: 90.0
      max: 120.0
    pressure:
      warningLow: 0.8
      warningHigh: 1.2
      criticalLow: 0.5
      criticalHigh: 1.5
    errorCodes:
      critical:
        - E001
        - E002
        - E003
        - E010
        - E020
      warning:
        - W001
        - W002
        - W003
        - W010

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/actuator/prometheus"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - equipment-stream-processor
          topologyKey: kubernetes.io/hostname

# Liveness and Readiness Probes
livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
