name: telemetry-ingestion-ci

on:
  push:
    paths:
      - "telemetry-ingestion/**"
      - ".github/workflows/telemetry-ingestion-ci.yml"
  pull_request:
    paths:
      - "telemetry-ingestion/**"

defaults:
  run:
    working-directory: telemetry-ingestion

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Unit tests and package
        run: ./mvnw -B verify

      - name: Package Helm chart
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm lint chart
          mkdir -p charts
          helm package chart --destination charts
